version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: image-search-backend
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
    environment:
      - DEBUG=false
      - UPLOAD_DIR=uploads
      - CHROMA_DIR=chroma_db
      - CLIP_MODEL=openai/clip-vit-base-patch32
      - DEFAULT_TOP_K=5
      - MAX_FILE_SIZE_MB=10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: image-search-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads_data:
    driver: local
  chroma_data:
    driver: local
