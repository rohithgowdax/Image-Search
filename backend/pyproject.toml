    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers",
    "pillow==11.0.0",
    "numpy==1.26.4",
    "chromadb",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "aiofiles==24.1.0",
]
